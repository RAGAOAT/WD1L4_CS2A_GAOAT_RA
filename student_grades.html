<!DOCTYPE html>
<!-- ==========================================================
     Activity No.: WD1-L4
     File        : student_grades.html
     Description : Student grade evaluation using arrays and a
                   for loop. CSS and JS are loaded as external files.
     ========================================================== -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Grades</title>

    <!-- External CSS (css folder) -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Main container for the page content -->
    <main class="container">
        <h1>Student Grade Evaluation</h1>

        <!-- The table body is filled in by js/script.js -->
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>Student Name</th>
                    <th>Grade</th>
                    <th>Remarks</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="gradeTableBody">
                <!-- Rows are generated by JavaScript -->
            </tbody>
        </table>

        <!-- Summary line (class average) is filled in by JavaScript -->
        <p id="summary" class="summary"></p>
    </main>

    <!-- External JS (js folder). Placed at the bottom so the DOM is ready -->
    <script src="js/script.js"></script>
</body>
</html>
